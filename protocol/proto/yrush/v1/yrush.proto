syntax = "proto3";

package yrush.v1;

option java_multiple_files = true;
option java_outer_classname = "YRushProtocol";
option java_package = "gg.wellplayed.yrush.protocol.v1";

// This v1 contract is intentionally incompatible with the retired task contract. WireMessage is
// the sole top-level value on the trainer-to-Fabric TCP transport. TCP adds a four-byte unsigned
// big-endian length prefix, and both peers reject payloads larger than 1 MiB. YRush state arrives
// separately from Paper as UTF-8 JSON on yrush:bot_state and is never wrapped in this contract.
message WireMessage {
  uint32 protocol_version = 1;

  oneof payload {
    ConnectionHello connection_hello = 10;
    ConnectionReady connection_ready = 11;
    ArmEpisode arm_episode = 12;
    EpisodeReady episode_ready = 13;
    ActionRequest action_request = 14;
    ActionApplied action_applied = 15;
    Observation observation = 16;
    EpisodeResult episode_result = 17;
    ProtocolError error = 18;
    Shutdown shutdown = 19;
  }
}

enum RoundPhase {
  ROUND_PHASE_UNSPECIFIED = 0;
  ROUND_PHASE_INACTIVE = 1;
  ROUND_PHASE_LOCKED_COUNTDOWN = 2;
  ROUND_PHASE_ACTIVE = 3;
  ROUND_PHASE_COMPLETE = 4;
}

enum RoundDirection {
  ROUND_DIRECTION_UNSPECIFIED = 0;
  ROUND_DIRECTION_UP = 1;
  ROUND_DIRECTION_DOWN = 2;
}

enum PlayerOutcome {
  PLAYER_OUTCOME_UNSPECIFIED = 0;
  PLAYER_OUTCOME_WON = 1;
  PLAYER_OUTCOME_LOST = 2;
  PLAYER_OUTCOME_ELIMINATED = 3;
  PLAYER_OUTCOME_DRAW = 4;
  PLAYER_OUTCOME_STOPPED = 5;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VERSION_MISMATCH = 1;
  ERROR_CODE_INVALID_MESSAGE = 2;
  ERROR_CODE_STALE_REQUEST = 3;
  ERROR_CODE_STALE_ROUND = 4;
  ERROR_CODE_SEQUENCE_VIOLATION = 5;
  ERROR_CODE_ACTION_TIMEOUT = 6;
  ERROR_CODE_ROUND_ORDERING = 7;
  ERROR_CODE_MINECRAFT_DISCONNECTED = 8;
  ERROR_CODE_INTERNAL = 9;
}

message ConnectionHello {
  uint32 protocol_version = 1;
  string session_id = 2;
  string client_nonce = 3;
  uint64 client_tick = 4;
}

message ConnectionReady {
  uint32 protocol_version = 1;
  string session_id = 2;
  string minecraft_version = 3;
  string player_uuid = 4;
  string player_name = 5;
  uint64 client_tick = 6;
}

// Arms this endpoint for its next eligible complete lifecycle. If a round is already active, the
// client skips it and waits for INACTIVE -> LOCKED_COUNTDOWN -> ACTIVE.
message ArmEpisode {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 round_sequence = 4;
  uint64 policy_version = 5;
  uint64 client_tick = 6;
}

message EpisodeReady {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 round_sequence = 4;
  uint64 policy_version = 5;
  uint64 client_tick = 6;
  RoundDirection direction = 7;
  sint32 target_y = 8;
  uint32 active_players = 9;
  uint32 total_players = 10;
  uint32 action_hold_ticks = 11;
}

// action contains exactly six zero-based choices in this order: forward axis, strafe axis, jump,
// attack/mine, yaw delta, pitch delta. Their exclusive upper bounds are [3, 3, 2, 2, 5, 5].
message ActionRequest {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 round_sequence = 3;
  uint64 policy_version = 4;
  uint64 client_tick = 5;
  uint64 observation_sequence = 6;
  uint64 action_sequence = 7;
  repeated uint32 action = 8 [packed = true];
}

message ActionApplied {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 round_sequence = 3;
  uint64 policy_version = 4;
  uint64 client_tick = 5;
  uint64 observation_sequence = 6;
  uint64 action_sequence = 7;
  repeated uint32 action = 8 [packed = true];
  uint32 hold_ticks = 9;
}

// block_properties has 5*5*5*4 bytes. Blocks are ordered bottom-to-top, then local-forward,
// then local-right. Each block contributes collision, fluid, damaging-hazard, and breakable bytes.
message Observation {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 round_sequence = 3;
  uint64 policy_version = 4;
  uint64 client_tick = 5;
  uint64 observation_sequence = 6;
  uint64 action_sequence = 7;
  RoundPhase phase = 8;
  bytes block_properties = 9;
  double signed_target_height_difference = 10;
  double forward_velocity = 11;
  double strafe_velocity = 12;
  double vertical_velocity = 13;
  double fractional_x = 14;
  double fractional_y = 15;
  double fractional_z = 16;
  bool grounded = 17;
  double remaining_time_fraction = 18;
  double yaw_residual_degrees = 19;
  double pitch_degrees = 20;
  double health_fraction = 21;
  double air_fraction = 22;
  uint32 active_players = 23;
  uint32 total_players = 24;
}

message EpisodeResult {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 round_sequence = 3;
  uint64 policy_version = 4;
  uint64 client_tick = 5;
  uint64 observation_sequence = 6;
  PlayerOutcome outcome = 7;
  string winner_uuid = 8;
  uint32 participant_count = 9;
  double completion_time_seconds = 10;
  double best_remaining_target_distance = 11;
}

message ProtocolError {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 round_sequence = 4;
  uint64 policy_version = 5;
  uint64 client_tick = 6;
  uint64 observation_sequence = 7;
  uint64 action_sequence = 8;
  ErrorCode code = 9;
  string message = 10;
  bool retryable = 11;
}

message Shutdown {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 round_sequence = 4;
  string reason = 5;
}
