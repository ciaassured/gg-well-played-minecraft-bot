syntax = "proto3";

package jump.v1;

option java_multiple_files = true;
option java_outer_classname = "JumpProtocol";
option java_package = "gg.wellplayed.jump.protocol.v1";

// Protocol v2 uses WireMessage as the sole top-level value on both transports. TCP adds a
// four-byte unsigned big-endian length prefix; Minecraft custom payloads use
// their existing packet framing. Receivers reject payloads larger than 1 MiB.
message WireMessage {
  uint32 protocol_version = 1;

  reserved 21 to 23;
  reserved "capture_request", "capture_ready", "capture_complete";

  oneof payload {
    ConnectionHello connection_hello = 10;
    ConnectionReady connection_ready = 11;
    ResetRequest reset_request = 12;
    EpisodeReady episode_ready = 13;
    EpisodeState episode_state = 14;
    ActionRequest action_request = 15;
    ActionApplied action_applied = 16;
    Observation observation = 17;
    EpisodeResult episode_result = 18;
    ProtocolError error = 19;
    Shutdown shutdown = 20;
    CommandFinalize command_finalize = 24;
    EpisodeArtifact episode_artifact = 25;
    RetentionAcknowledgement retention_acknowledgement = 26;
    BatchComplete batch_complete = 27;
  }
}

enum EpisodePhase {
  EPISODE_PHASE_UNSPECIFIED = 0;
  EPISODE_PHASE_RESETTING = 1;
  EPISODE_PHASE_READY = 2;
  EPISODE_PHASE_ACTIVE = 3;
  EPISODE_PHASE_TERMINAL = 4;
  EPISODE_PHASE_ABORTED = 5;
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_NOOP = 1;
  ACTION_JUMP = 2;
}

enum TerminalReason {
  TERMINAL_REASON_UNSPECIFIED = 0;
  TERMINAL_REASON_SUCCESS = 1;
  TERMINAL_REASON_MISSED_JUMP = 2;
  TERMINAL_REASON_TIME_LIMIT = 3;
  TERMINAL_REASON_INFRASTRUCTURE_ERROR = 4;
}

enum ErrorCode {
  reserved 8;
  reserved "ERROR_CODE_NOT_RECORDING";

  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VERSION_MISMATCH = 1;
  ERROR_CODE_INVALID_MESSAGE = 2;
  ERROR_CODE_STALE_REQUEST = 3;
  ERROR_CODE_STALE_EPISODE = 4;
  ERROR_CODE_SEQUENCE_VIOLATION = 5;
  ERROR_CODE_ACTION_TIMEOUT = 6;
  ERROR_CODE_RESET_TIMEOUT = 7;
  ERROR_CODE_INTERNAL = 9;
}

enum EpisodeRecordingStatus {
  EPISODE_RECORDING_STATUS_UNSPECIFIED = 0;
  EPISODE_RECORDING_STATUS_COMPLETE = 1;
  EPISODE_RECORDING_STATUS_PARTIAL = 2;
}

message ConnectionHello {
  reserved 3;
  reserved "mode";

  uint32 protocol_version = 1;
  string session_id = 2;
  string client_nonce = 4;
  uint64 client_tick = 5;
}

message ConnectionReady {
  reserved 3;
  reserved "mode";

  uint32 protocol_version = 1;
  string session_id = 2;
  string minecraft_version = 4;
  uint64 client_tick = 5;
  uint64 server_tick = 6;
}

message ResetRequest {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 episode_id = 4;
  uint64 seed = 5;
  uint64 client_tick = 6;
}

message EpisodeReady {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 episode_id = 4;
  uint64 seed = 5;
  double starting_gap = 6;
  double wall_near_coordinate = 7;
  double wall_far_coordinate = 8;
  double wall_min_cross_coordinate = 9;
  double wall_max_cross_coordinate = 10;
  double lane_direction_x = 11;
  double lane_direction_z = 12;
  double standing_feet_y = 13;
  uint64 client_tick = 14;
  uint64 initial_server_tick = 15;
}

message EpisodeState {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 episode_id = 3;
  uint64 server_tick = 4;
  uint32 elapsed_ticks = 5;
  EpisodePhase phase = 6;
  TerminalReason terminal_reason = 7;
}

message ActionRequest {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 episode_id = 3;
  uint64 client_tick = 4;
  uint64 server_tick = 5;
  uint64 observation_sequence = 6;
  uint64 action_sequence = 7;
  Action action = 8;
}

message ActionApplied {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 episode_id = 3;
  uint64 client_tick = 4;
  uint64 server_tick = 5;
  uint64 observation_sequence = 6;
  uint64 action_sequence = 7;
  Action requested_action = 8;
}

message Observation {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 episode_id = 3;
  uint64 client_tick = 4;
  uint64 server_tick = 5;
  uint64 observation_sequence = 6;
  uint64 action_sequence = 7;
  EpisodePhase phase = 8;
  TerminalReason terminal_reason = 9;
  double signed_wall_distance = 10;
  double relative_feet_height = 11;
  double vertical_velocity = 12;
  double lane_velocity = 13;
  bool on_ground = 14;
  uint32 elapsed_ticks = 15;
}

message EpisodeResult {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 episode_id = 3;
  uint64 server_tick = 4;
  uint32 elapsed_ticks = 5;
  TerminalReason terminal_reason = 6;
}

message ProtocolError {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 episode_id = 4;
  uint64 client_tick = 5;
  uint64 server_tick = 6;
  uint64 observation_sequence = 7;
  uint64 action_sequence = 8;
  ErrorCode code = 9;
  string message = 10;
  bool retryable = 11;
}

message Shutdown {
  reserved 6, 7;
  reserved "disconnect_minecraft", "reconnect_minecraft";

  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 episode_id = 4;
  string reason = 5;
}

// CommandFinalize ends the recording batch associated with one trainer TCP
// connection. Fabric stops any active episode as partial, disconnects from
// Paper once, and asks Replay Mod to post-process all episode split markers.
message CommandFinalize {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint64 active_episode_id = 4;
  string reason = 5;
  bool interrupted = 6;
  uint32 transfer_timeout_seconds = 7;
}

// EpisodeArtifact offers one finalized staging file. Ordinals begin at zero
// and follow reset order for the command. The client offers the next artifact
// only after this one is acknowledged or its acknowledgement times out.
message EpisodeArtifact {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint32 ordinal = 4;
  uint64 episode_id = 5;
  uint64 seed = 6;
  EpisodeRecordingStatus recording_status = 7;
  TerminalReason terminal_reason = 8;
  string staging_path = 9;
  uint64 size_bytes = 10;
  bytes sha256 = 11;
}

// A negative acknowledgement preserves the staging source but lets the client
// continue offering later artifacts. A positive acknowledgement authorizes
// deletion only when the identifiers and digest match the outstanding offer.
message RetentionAcknowledgement {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint32 ordinal = 4;
  uint64 episode_id = 5;
  bytes sha256 = 6;
  bool retained = 7;
  string detail = 8;
}

// BatchComplete is emitted after every available artifact has been handled.
// Fabric reconnects to Paper after sending it, even when some files remain in
// staging for recovery.
message BatchComplete {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  string session_id = 3;
  uint32 expected_artifacts = 4;
  uint32 offered_artifacts = 5;
  uint32 retained_artifacts = 6;
  uint32 preserved_artifacts = 7;
  repeated string warnings = 8;
  bool reconnecting_minecraft = 9;
}
