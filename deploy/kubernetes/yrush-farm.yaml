apiVersion: v1
kind: Namespace
metadata:
  name: yrush-training
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yrush-paper-ops
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-paper
data:
  ops.json: |
    [
      {
        "uuid": "e3b1f250-3927-3602-9360-4ae0fe3b6b69",
        "name": "aurah__",
        "level": 4,
        "bypassesPlayerLimit": true
      }
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: yrush-paper
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-paper
  annotations:
    lbipam.cilium.io/ips: 10.128.16.2
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: yrush-paper
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yrush-paper
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-paper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yrush-paper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-paper
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        yrush.gg/local-ssd: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: yrush-client
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: seed-operator-config
          image: docker.io/library/busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          imagePullPolicy: IfNotPresent
          command: [/bin/cp, /config/ops.json, /data/ops.json]
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              cpu: 50m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ops
              mountPath: /config
              readOnly: true
      containers:
        - name: paper
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-server:REPLACE_WITH_COMMIT
          imagePullPolicy: IfNotPresent
          ports:
            - name: minecraft
              containerPort: 25565
          env:
            - name: YRUSH_EXPECTED_CLIENT_COUNT
              value: "4"
            - name: YRUSH_MAX_PLAYERS
              value: "8"
            - name: YRUSH_SERVER_XMS
              value: 4g
            - name: YRUSH_SERVER_XMX
              value: 8g
            - name: YRUSH_WORLD_SEED
              value: "20260904"
            - name: YRUSH_STARTUP_TIMEOUT_SECONDS
              value: "900"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_RESTART_COUNT
              value: "0"
            - name: YRUSH_FAIL_ON_CONTAINER_RESTART
              value: "1"
          readinessProbe:
            exec:
              command: [test, -s, /data/ready]
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [test, "!", -e, /data/fixed-pool-failure]
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "4"
              memory: 10Gi
              ephemeral-storage: 50Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 50Gi
        - name: ops
          configMap:
            name: yrush-paper-ops
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: yrush-clients
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-client
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: yrush-client
  ports:
    - name: trainer
      port: 64123
      targetPort: trainer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yrush-client
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-client
spec:
  replicas: 4
  podManagementPolicy: Parallel
  serviceName: yrush-clients
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: yrush-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-client
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: yrush-paper
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: yrush-client
      containers:
        - name: client
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-client:REPLACE_WITH_COMMIT
          imagePullPolicy: IfNotPresent
          ports:
            - name: trainer
              containerPort: 64123
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: YRUSH_PAPER_ADDRESS
              value: yrush-paper:25565
            - name: YRUSH_TRAINER_BIND
              value: 0.0.0.0
            - name: YRUSH_TRAINER_PORT
              value: "64123"
            - name: YRUSH_CLIENT_RUNTIME
              value: /runtime
            - name: YRUSH_CLIENT_READINESS_FILE
              value: /runtime/ready
            - name: YRUSH_CLIENT_XMS
              value: 192m
            - name: YRUSH_CLIENT_XMX
              value: 320m
          readinessProbe:
            exec:
              command: [test, -s, /runtime/ready]
            periodSeconds: 5
            failureThreshold: 180
          resources:
            requests:
              cpu: 500m
              memory: 1152Mi
            limits:
              cpu: "1"
              memory: 1152Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: runtime
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-nasdaq
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yrush-artifacts
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-trainer
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-nasdaq
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yrush-run-metadata
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-trainer
data:
  YRUSH_EXPECTED_CLIENT_COUNT: "4"
  YRUSH_WORLD_SEED: "20260904"
  YRUSH_CLUSTER_REVISION: REPLACE_WITH_COMMIT
  YRUSH_GIT_REVISION: REPLACE_WITH_COMMIT
  YRUSH_SERVER_IMAGE_REVISION: REPLACE_WITH_COMMIT
  YRUSH_CLIENT_IMAGE_REVISION: REPLACE_WITH_COMMIT
  YRUSH_TRAINER_IMAGE_REVISION: REPLACE_WITH_COMMIT
  YRUSH_SERVER_POD_UID: REPLACE_WITH_SERVER_POD_UID
  YRUSH_SERVER_RESTART_COUNT: "0"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: yrush-default-deny
  namespace: yrush-training
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            yrush-training-default-deny: "never"
  egress:
    - toEndpoints:
        - matchLabels:
            yrush-training-default-deny: "never"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: yrush-dns
  namespace: yrush-training
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: yrush-trainer-to-clients
  namespace: yrush-training
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: yrush-trainer
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: yrush-client
      toPorts:
        - ports:
            - port: "64123"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: yrush-client-ingress
  namespace: yrush-training
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: yrush-client
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: yrush-trainer
      toPorts:
        - ports:
            - port: "64123"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: yrush-clients-to-paper-and-downloads
  namespace: yrush-training
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: yrush-client
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: yrush-paper
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
    - toEntities: [world]
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: yrush-paper-ingress
  namespace: yrush-training
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: yrush-paper
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: yrush-client
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
    - fromCIDR:
        - 192.168.98.0/24
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yrush-canary
  namespace: yrush-training
  labels:
    app.kubernetes.io/name: yrush-trainer
    yrush.gg/stage: canary
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-trainer
        yrush.gg/stage: canary
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-trainer:REPLACE_WITH_COMMIT
          args:
            - canary
            - --endpoint-template
            - yrush-client-{index}.yrush-clients:64123
            - --clients
            - "4"
            - --run-root
            - /artifacts/runs
            - --run-id
            - canary-REPLACE_WITH_RUN_ID
          envFrom:
            - configMapRef:
                name: yrush-run-metadata
          env:
            - name: HOME
              value: /tmp
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: NUMEXPR_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: yrush-artifacts
        - name: tmp
          emptyDir: {}
---
