apiVersion: v1
kind: Service
metadata:
  name: yrush-paper
  labels:
    app.kubernetes.io/name: yrush-paper
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: yrush-paper
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yrush-paper
  labels:
    app.kubernetes.io/name: yrush-paper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yrush-paper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-paper
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        yrush.gg/local-ssd: "true"
      containers:
        - name: paper
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-server:REPLACE_WITH_COMMIT
          imagePullPolicy: IfNotPresent
          ports:
            - name: minecraft
              containerPort: 25565
          env:
            - name: YRUSH_EXPECTED_CLIENT_COUNT
              value: "4"
            - name: YRUSH_MAX_PLAYERS
              value: "8"
            - name: YRUSH_SERVER_XMS
              value: 4g
            - name: YRUSH_SERVER_XMX
              value: 8g
            - name: YRUSH_WORLD_SEED
              value: "20260904"
            - name: YRUSH_STARTUP_TIMEOUT_SECONDS
              value: "900"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_RESTART_COUNT
              value: "0"
            - name: YRUSH_FAIL_ON_CONTAINER_RESTART
              value: "1"
          readinessProbe:
            exec:
              command: ["test", "-s", "/data/ready"]
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["test", "!", "-e", "/data/fixed-pool-failure"]
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "4"
              memory: 10Gi
              ephemeral-storage: 50Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: yrush-clients
  labels:
    app.kubernetes.io/name: yrush-client
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: yrush-client
  ports:
    - name: trainer
      port: 64123
      targetPort: trainer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yrush-client
  labels:
    app.kubernetes.io/name: yrush-client
spec:
  replicas: 4
  podManagementPolicy: Parallel
  serviceName: yrush-clients
  selector:
    matchLabels:
      app.kubernetes.io/name: yrush-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-client
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: minecraft
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-client:REPLACE_WITH_COMMIT
          imagePullPolicy: IfNotPresent
          ports:
            - name: trainer
              containerPort: 64123
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: YRUSH_PAPER_ADDRESS
              value: yrush-paper:25565
            - name: YRUSH_TRAINER_BIND
              value: 0.0.0.0
            - name: YRUSH_TRAINER_PORT
              value: "64123"
            - name: YRUSH_CLIENT_XMS
              value: 256m
            - name: YRUSH_CLIENT_XMX
              value: 512m
          readinessProbe:
            exec:
              command: ["test", "-s", "/runtime/ready"]
            periodSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: runtime
              mountPath: /runtime
      volumes:
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yrush-artifacts
  labels:
    app.kubernetes.io/name: yrush-trainer
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yrush-run-metadata
  labels:
    app.kubernetes.io/name: yrush-trainer
data:
  YRUSH_EXPECTED_CLIENT_COUNT: "4"
  YRUSH_WORLD_SEED: "20260904"
  YRUSH_CLUSTER_REVISION: REPLACE_WITH_COMMIT
  YRUSH_GIT_REVISION: REPLACE_WITH_COMMIT
  YRUSH_SERVER_IMAGE_REVISION: REPLACE_WITH_COMMIT
  YRUSH_CLIENT_IMAGE_REVISION: REPLACE_WITH_COMMIT
  YRUSH_TRAINER_IMAGE_REVISION: REPLACE_WITH_COMMIT
  YRUSH_SERVER_POD_UID: REPLACE_WITH_SERVER_POD_UID
  YRUSH_SERVER_RESTART_COUNT: "0"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yrush-canary
  labels:
    app.kubernetes.io/name: yrush-trainer
    yrush.gg/stage: canary
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-trainer
        yrush.gg/stage: canary
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-trainer:REPLACE_WITH_COMMIT
          args:
            - canary
            - --endpoint-template
            - yrush-client-{index}.yrush-clients:64123
            - --clients
            - "4"
            - --run-root
            - /artifacts/runs
            - --run-id
            - canary-REPLACE_WITH_RUN_ID
          envFrom:
            - configMapRef:
                name: yrush-run-metadata
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: yrush-artifacts
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yrush-tuning-canary
  labels:
    app.kubernetes.io/name: yrush-trainer
    yrush.gg/stage: tuning-canary
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-trainer
        yrush.gg/stage: tuning-canary
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-trainer:REPLACE_WITH_COMMIT
          args:
            - tuning-canary
            - --endpoint-template
            - yrush-client-{index}.yrush-clients:64123
            - --clients
            - "4"
            - --run-root
            - /artifacts/runs
            - --run-id
            - tuning-canary-REPLACE_WITH_RUN_ID
          envFrom:
            - configMapRef:
                name: yrush-run-metadata
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: yrush-artifacts
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yrush-proof
  labels:
    app.kubernetes.io/name: yrush-trainer
    yrush.gg/stage: proof
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yrush-trainer
        yrush.gg/stage: proof
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: ghcr.io/ciaassured/gg-well-played-minecraft-bot-trainer:REPLACE_WITH_COMMIT
          args:
            - proof
            - --endpoint-template
            - yrush-client-{index}.yrush-clients:64123
            - --clients
            - "4"
            - --run-root
            - /artifacts/runs
            - --run-id
            - proof-REPLACE_WITH_RUN_ID
          envFrom:
            - configMapRef:
                name: yrush-run-metadata
          volumeMounts:
            - name: artifacts
