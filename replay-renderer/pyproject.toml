[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jump-replay-renderer"
version = "1.0.0"
description = "Validated unattended Replay Mod video rendering"
requires-python = ">=3.13"

[project.scripts]
jump-replay-renderer = "jump_replay_renderer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
