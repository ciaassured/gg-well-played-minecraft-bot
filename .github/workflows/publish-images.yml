name: Publish images

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-images:
    name: Publish coordinated yrush-v1 images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REVISION: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_REVISION }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build all images before publishing any
        run: |
          nix run ./yrush-server#image -- build result-server
          nix run ./client-mod#image -- build result-client
          nix run ./trainer#image -- build result-trainer

      - name: Publish commit-tagged images to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run ./yrush-server#image -- publish "$IMAGE_REVISION"
          nix run ./client-mod#image -- publish "$IMAGE_REVISION"
          nix run ./trainer#image -- publish "$IMAGE_REVISION"
